spring.application.name=TechDocs
server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/techdocs}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:techdocs}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:techdocs}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always
