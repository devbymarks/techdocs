services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techdocs}
      POSTGRES_USER: ${POSTGRES_USER:-techdocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-deploy}
    volumes: ["techdocs_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techdocs} -d ${POSTGRES_DB:-techdocs}"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-techdocs}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-techdocs}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-deploy}
    ports: ["8080:8080"]
volumes:
  techdocs_data:
